services:
  # Turns on traces only when the local observability interface is requested.
  api:
    environment:
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
    depends_on:
      otel-collector:
        condition: service_started

  worker:
    environment:
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
    depends_on:
      otel-collector:
        condition: service_started

  # Exposes broker and database ports for local inspection tools.
  rabbitmq:
    ports:
      - "5672:5672"
      - "15672:15672"

  mongo:
    ports:
      - "27017:27017"

  # Jaeger reads traces in memory and RED metrics generated from them.
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      METRICS_STORAGE_TYPE: prometheus
      PROMETHEUS_SERVER_URL: http://prometheus:9090
      PROMETHEUS_QUERY_SUPPORT_SPANMETRICS_CONNECTOR: "true"
      PROMETHEUS_QUERY_NAMESPACE: traces_span_metrics
      PROMETHEUS_QUERY_NORMALIZE_CALLS: "true"
      PROMETHEUS_QUERY_NORMALIZE_DURATION: "true"
    command: ["--query.ui-config=/etc/jaeger/ui.json"]
    ports:
      - "16686:16686"
    volumes:
      - ./infra/observability/jaeger-ui.json:/etc/jaeger/ui.json:ro
    depends_on:
      prometheus:
        condition: service_started

  # Collector forwards traces to Jaeger and derives SPM metrics from spans.
  otel-collector:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.158.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/observability/otel-collector.yml:/etc/otelcol/config.yaml:ro
    depends_on:
      jaeger:
        condition: service_started

  # Prometheus stores the RED metrics that power Jaeger's Monitor tab.
  prometheus:
    image: prom/prometheus:v3.13.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports:
      - "9090:9090"
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  # Mongo Express is a development-only UI for MongoDB documents.
  mongo-express:
    image: mongo-express:1.0.2-20-alpine3.19
    environment:
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: root
      ME_CONFIG_MONGODB_URL: mongodb://root:root@mongo:27017/
    ports:
      - "8081:8081"
    depends_on:
      mongo:
        condition: service_healthy
